<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цепочка слов</title>
<style>
:root{--bg:#faf7f2;--fg:#1f1b16;--mut:#7a7066;--card:#fff;--acc:#d9622b;--ok:#2f8f5b;--bd:#e5ddd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--fg:#f3ede4;--mut:#a39a8e;--card:#241f19;--acc:#ef7d45;--ok:#3aa56c;--bd:#3a332a}}
:root[data-theme="dark"]{--bg:#17140f;--fg:#f3ede4;--mut:#a39a8e;--card:#241f19;--acc:#ef7d45;--ok:#3aa56c;--bd:#3a332a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{text-align:center;margin:28px 16px 0;font-size:clamp(28px,7vw,44px);letter-spacing:-.5px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;text-align:center}
button{font:inherit;font-weight:600;border:0;border-radius:14px;background:var(--acc);color:#fff;padding:14px 28px;font-size:18px;cursor:pointer}
button:disabled{opacity:.5}
.sec{background:var(--card);color:var(--fg);border:1px solid var(--bd);padding:10px 16px;font-size:15px}
.w{display:flex;gap:6px;justify-content:center}
.t{width:clamp(44px,14vw,64px);aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--bd);border-radius:12px;background:var(--card);font-size:clamp(24px,8vw,36px);font-weight:700;text-transform:uppercase}
.t.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sm .t{width:34px;font-size:18px;border-radius:8px}
.mut{color:var(--mut);font-size:15px}
input{font:inherit;font-size:20px;text-align:center;text-transform:uppercase;width:150px;padding:10px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.err{color:#d23b3b;min-height:20px;font-size:15px}
.hist{max-width:100%;overflow-x:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.big{font-size:22px;font-weight:700}
</style></head><body>
<h1>Цепочка слов</h1>
<main id="app"></main>
<script>
const WORDS=new Set(`арка аист айва ария база балл бант банк бард барс баня беда блок бобр брак брат бриз брод буря бюст боль баян байт борт бык
вата вена вера взор вила вина вкус вода воин враг врач вред вино вход вилы
гном гора горб горн град гриб гроб груз губа гусь гимн гонг грот
дама даль дань двор дело день дерн долг доля дуга дура дыня дюна дача дочь доза дата джем дичь диск друг дуэт душа дуло
ежик жгут жест жила жито жуть жара жало
заря звон звук зима змея знак зной зубр зонт зола зять
игла игра идея изба икра ирис итог
кадр кайф каша кеды клад клей клуб клык кнут коза кожа кора корм корт краб край крен крик кров круг куст куча коса карп клоп ковш кино курс
лава лайм лама лень лето лист лиса лифт лицо ложа ложь лось луна лупа лужа лыжа лыко лапа лоза липа лира лайк
март мать матч мель меню мера мета метр мина миля мост мука муха мыло мышь мясо мочь моль маяк мода море мрак мята мгла
наст нива ниша нога нора нота ночь нрав нить ноль
обед овца овес окно отец
пара парк пень перо плед плен плот плуг плюс пляж поле полк порт пост поэт пояс пруд пила пиво пика пирс пион печь поза пуля пуск пыль
раки рама рана река роза рожь роль рота руда руль рысь рейс ряса роса рука рыло
сайт сало сани свет сено сеть сила сито слон слог слух смех снег спор срок стая стан стол стул стон стук стог стык сова сода соль соло село сказ суть суша скат свод смог соус спад
танк тара тень тигр тина толк торт тост трап трос труд трус туча тюль тело тема темп тест титр тент такт трюк туша тяга
узел улей урна утро уха ухо угол удар урок утка упор урон
факт фара фига флаг флот фонд фото фунт форт фея фаза
хата хлеб хлам холм храм хвоя
цель цена цепь цирк цвет цинк
чаша чело чудо чары часы
шарф шаль шанс шест шина шило шкаф шлем шея шуба штат штык
щека щель щука
эпос этаж
юбка юмор юнга юрта
язык ярус ясли ящик яхта`.split(/\s+/).filter(w=>w.length===4));
const L=[...WORDS];
const diff=(a,b)=>{let n=0;for(let i=0;i<4;i++)if(a[i]!==b[i])n++;return n};
const ADJ={};for(const w of L)ADJ[w]=[];
for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++)if(diff(L[i],L[j])===1){ADJ[L[i]].push(L[j]);ADJ[L[j]].push(L[i])}
function puzzle(){
  for(let k=0;k<200;k++){
    const s=L[Math.floor(Math.random()*L.length)],d={[s]:0},q=[s];
    for(let i=0;i<q.length;i++)for(const n of ADJ[q[i]])if(!(n in d)){d[n]=d[q[i]]+1;q.push(n)}
    const c=q.filter(w=>d[w]>=3&&d[w]<=5);
    if(c.length)return[s,c[Math.floor(Math.random()*c.length)]];
  }
  return["стул","стол"];
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tiles=(w,t,cls="")=>`<div class="w ${cls}">${[...w].map((c,i)=>`<div class="t${t&&t[i]===c?" ok":""}">${esc(c)}</div>`).join("")}</div>`;
const app=document.getElementById("app");
let db=null,me=null,gid="",ref=null,unsub=null,msg="";

function home(err){
  app.innerHTML=`<button id="mk">Создать игру</button><div class="err">${err||""}</div>`;
  document.getElementById("mk").onclick=create;
}
async function create(){
  const b=document.getElementById("mk");b.disabled=true;
  try{
    const[s,t]=puzzle();
    gid="g"+Math.random().toString(36).slice(2,8);
    await db.doc("games/"+gid).set({a:me,b:"",turn:"a",start:s,target:t,cur:s,hist:[s],win:""});
    location.hash=gid;
    open_(gid);
  }catch(e){home("Не удалось создать игру. Попробуйте ещё раз.")}
}
function open_(id){
  gid=id;if(unsub)unsub();
  ref=db.doc("games/"+id);
  app.innerHTML='<div class="mut">Загрузка…</div>';
  const timer=setTimeout(()=>{app.innerHTML='<div class="mut">Игра не найдена или недоступна.</div>'},10000);
  unsub=ref.onSnapshot(s=>{clearTimeout(timer);if(!s.exists){app.innerHTML='<div class="mut">Игра не найдена.</div>';return}
    const g=s.data();
    if(g.a!==me&&!g.b&&me){ref.update({b:me}).catch(()=>{});return}
    show(g);
  },()=>{clearTimeout(timer);app.innerHTML='<div class="mut">Не удалось подключиться к игре.</div>'});
}
function show(g){
  const role=g.a===me?"a":g.b===me?"b":"";
  if(!role){app.innerHTML='<div class="mut">В этой игре уже два игрока.</div>';return}
  const link=location.href;
  let h=`<div class="mut">Превратите слово в слово</div>
  <div class="row" style="gap:14px">${tiles(g.start,"","sm")}<span class="big">→</span>${tiles(g.target,"","sm")}</div>`;
  if(!g.b){
    h+=`<div class="mut">Отправьте другу ссылку-приглашение:</div>
    <div class="row"><input id="lk" readonly value="${esc(link)}" style="width:min(320px,80vw);text-transform:none;font-size:15px"><button class="sec" id="cp">Копировать</button></div>
    <div class="mut">Ждём второго игрока…</div>`;
  }else{
    h+=tiles(g.cur,g.target);
    if(g.win){
      h+=`<div class="big">${g.win===role?"Вы победили! 🎉":"Друг выиграл"}</div><button id="again">Новая игра</button>`;
    }else if(g.turn===role){
      h+=`<div class="big">Ваш ход</div>
      <div class="mut">Измените ровно одну букву — получится настоящее слово</div>
      <div class="row"><input id="nw" maxlength="4" autocomplete="off" autocapitalize="off"><button id="go">Ходить</button></div>
      <div class="err" id="er">${esc(msg)}</div>`;
    }else{
      h+=`<div class="big">Ход друга…</div>`;
    }
    h+=`<div class="hist">${g.hist.map((w,i)=>(i?'<span class="mut">→</span>':"")+`<span class="mut">${esc(w)}</span>`).join("")}</div>`;
  }
  app.innerHTML=h;
  const cp=document.getElementById("cp");
  if(cp)cp.onclick=()=>{const i=document.getElementById("lk");i.select();try{navigator.clipboard.writeText(i.value)}catch(e){}cp.textContent="Скопировано"};
  const go=document.getElementById("go");
  if(go){const nw=document.getElementById("nw");nw.focus();go.onclick=()=>move(g,role,nw.value);nw.onkeydown=e=>{if(e.key==="Enter")go.click()}}
  const ag=document.getElementById("again");
  if(ag)ag.onclick=()=>{const[s,t]=puzzle();ref.update({start:s,target:t,cur:s,hist:[s],win:"",turn:"a"}).catch(()=>{})};
  msg="";
}
function move(g,role,v){
  const w=v.trim().toLowerCase().replace(/ё/g,"е"),er=document.getElementById("er");
  const bad=t=>{er.textContent=t};
  if(w.length!==4)return bad("Нужно слово из 4 букв");
  if(!WORDS.has(w))return bad("Такого слова нет в словаре");
  if(diff(w,g.cur)!==1)return bad("Нужно изменить ровно одну букву");
  if(g.hist.includes(w))return bad("Это слово уже было");
  ref.update({cur:w,hist:[...g.hist,w],turn:role==="a"?"b":"a",win:w===g.target?role:""}).catch(()=>bad("Не удалось сделать ход"));
}
(async()=>{
  home("");
  try{
    const[d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u){home("Для игры нужно войти в аккаунт Claude.");return}
    db=d;me=await u.id();
    const h=location.hash.slice(1);
    if(h)open_(h);
  }catch(e){home("Не удалось подключиться.")}
})();
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(db&&h&&h!==gid)open_(h)});
</script></body></html>
