const rnd=()=>Math.random().toString(36).slice(2,10);
me=rnd()+rnd();
const send=m=>fetch(BASE+topic,{method:"POST",body:JSON.stringify({...m,from:me})}).catch(()=>{});
const pub=()=>{if(guest)send({t:"state",to:guest,g:G})};
const noServer='Не удалось связаться с сервером ntfy.sh. Возможно, он недоступен в вашей сети.';
function listen(onmsg,onopen,onfail){
  const es=new EventSource(BASE+topic+"/sse");
  let ok=false;
  const t=setTimeout(()=>{if(!ok)onfail()},10000);
  es.onopen=()=>{ok=true;clearTimeout(t);onopen()};
  es.onmessage=e=>{try{const j=JSON.parse(e.data);if(j.event!=="message")return;const m=JSON.parse(j.message);if(m&&m.from!==me)onmsg(m)}catch(_){}};
}
function home(err){
  app.innerHTML=`<button id="mk">Создать игру</button><div class="err">${esc(err||"")}</div>`;
  document.getElementById("mk").onclick=startHost;
}
function startHost(){
  app.innerHTML='<div class="mut">Создаём игру…</div>';
  topic="wc"+rnd()+rnd();role="a";G=fresh();guest="";
  let shown=false;
  listen(m=>{
    if(m.t==="hello"){
      if(!guest||guest===m.from){guest=m.from;G.joined=true;pub();show()}
      else send({t:"full",to:m.from});
    }else if(m.t==="move"&&m.from===guest)apply("b",String(m.w));
    else if(m.t==="again"&&m.from===guest&&G.win)restart();
  },()=>{if(!shown){shown=true;location.hash=topic;show()}},()=>home(noServer));
}
function join(h){
  topic=h;role="b";
  app.innerHTML='<div class="mut">Подключаемся…</div>';
  listen(m=>{
    if(m.to!==me)return;
    if(m.t==="state"&&m.g&&Array.isArray(m.g.hist)){got=true;clearTimeout(timer);G=m.g;show()}
    else if(m.t==="full"){full=true;clearTimeout(timer);app.innerHTML='<div class="mut">В этой игре уже два игрока.</div>'}
  },hello,()=>{app.innerHTML=`<div class="mut">${noServer}</div>`});
}
function hello(){
  clearTimeout(timer);
  if(full)return;
  if(got){send({t:"hello"});return}
  if(tries++>=6){app.innerHTML='<div class="mut">Хозяин игры не отвечает. Проверьте, что он не закрыл страницу, или попросите создать игру заново.</div>';return}
  send({t:"hello"});timer=setTimeout(hello,4000);
}
function show(){
  let h=`<div class="mut">Превратите слово в слово</div>
  <div class="row" style="gap:14px">${tiles(G.start,"","sm")}<span class="big">→</span>${tiles(G.target,"","sm")}</div>`;
  if(!G.joined){
    h+=`<div class="mut">Отправьте другу ссылку-приглашение:</div>
    <div class="row"><input id="lk" readonly value="${esc(location.href)}" style="width:min(320px,80vw);text-transform:none;font-size:15px"><button class="sec" id="cp">Копировать</button></div>
    <div class="mut">Ждём второго игрока… Не закрывайте эту страницу.</div>`;
  }else{
    h+=tiles(G.cur,G.target);
    if(!G.win)h+=`<div class="mut">Минимум ходов до цели: ${dist(G.cur,G.target,new Set(G.hist))}</div>`;
    if(G.win)h+=`<div class="big">${G.win===role?"Вы победили! 🎉":"Друг выиграл"}</div><button id="again">Новая игра</button>`;
    else if(G.turn===role)h+=`<div class="big">Ваш ход</div>
      <div class="mut">Измените ровно одну букву — получится настоящее слово</div>
      <div class="row"><input id="nw" maxlength="4" autocomplete="off" autocapitalize="off"><button id="go">Ходить</button></div>
      <div class="err" id="er"></div>`;
    else h+=`<div class="big">Ход друга…</div>`;
    h+=`<div class="hist">${G.hist.map((w,i)=>(i?'<span class="mut">→</span>':"")+`<span class="mut">${esc(w)}</span>`).join("")}</div>`;
  }
  app.innerHTML=h;
  const cp=document.getElementById("cp");
  if(cp)cp.onclick=()=>{const i=document.getElementById("lk");i.select();try{navigator.clipboard.writeText(i.value)}catch(e){}cp.textContent="Скопировано"};
  const go=document.getElementById("go");
  if(go){const nw=document.getElementById("nw");nw.focus();go.onclick=()=>move(nw.value);nw.onkeydown=e=>{if(e.key==="Enter")go.click()}}
  const ag=document.getElementById("again");
  if(ag)ag.onclick=()=>role==="a"?restart():send({t:"again"});
}
function check(w,r){
  if(G.win||G.turn!==r)return"Сейчас не ваш ход";
  if(w.length!==4)return"Нужно слово из 4 букв";
  if(!WORDS.has(w))return"Такого слова нет в словаре";
  if(diff(w,G.cur)!==1)return"Нужно изменить ровно одну букву";
  if(G.hist.includes(w))return"Это слово уже было";
  if(w!==G.target){const u=new Set(G.hist);u.add(w);if(dist(w,G.target,u)<0)return"После этого слова до цели уже не добраться — выберите другое";}
  return"";
}
const norm=v=>v.trim().toLowerCase().replace(/ё/g,"е");
function move(v){
  const w=norm(v),e=check(w,role);
  if(e){document.getElementById("er").textContent=e;return}
  if(role==="a")apply("a",w);else send({t:"move",w});
}
function apply(r,v){
  const w=norm(v);
  if(check(w,r))return;
  G.cur=w;G.hist.push(w);G.turn=other(r);G.win=w===G.target?r:"";
  pub();show();
}
function restart(){G=fresh();G.joined=!!guest;pub();show()}
const h0=location.hash.slice(1);
h0?join(h0):home("");
</script></body></html>
