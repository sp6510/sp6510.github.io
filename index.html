// расстояния от слова s до всех остальных (ok — какие слова разрешено использовать)
function bfs(s,ok){
  const d={[s]:0},q=[s];
  for(let i=0;i<q.length;i++)for(const n of ADJ[q[i]])if(!(n in d)&&ok(n)){d[n]=d[q[i]]+1;q.push(n)}

}

function dist(a,b,used){
  const d=bfs(a,n=>!used.has(n));
  return b in d?d[b]:-1;
}

function nextStep(cur,t,hist){

    const d={[t]:0},q=[t];
    for(let i=0;i<q.length;i++)for(const n of ADJ[q[i]])if(!(n in d)&&!used.has(n)&&ok(n)){d[n]=d[q[i]]+1;q.push(n)}

    for(const n of ADJ[cur])if(n in d&&(best===null||d[n]<d[best]))best=n;
    return best&&[best,d[best]];

}

}
function show(){
  for(const w of [G.cur,...G.hist])if(/^[а-я]{4}$/.test(w)&&!ADJ[w])addWord(w);
  let h=`<div class="mut">Превратите слово в слово</div>
  <div class="row" style="gap:14px">${tiles(G.start,"","sm")}<span class="big">→</span>${tiles(G.target,"","sm")}</div>`;
  if(!G.joined){
    h+=`<div class="mut">Отправьте другу ссылку-приглашение:</div>
    <div class="row"><input id="lk" readonly value="${esc(location.href)}" style="width:min(320px,80vw);text-transform:none;font-size:15px"><button class="sec" id="cp">Копировать</button></div>
    <div class="mut">Ждём второго игрока… Не закрывайте эту страницу.</div>`;
  }else{
    h+=tiles(G.cur,G.target);
    h+=`<div class="mut">Сложность: ${esc((LV[G.level]||{}).n||"—")}</div>`;
    if(!G.win)h+=`<div class="mut">Минимум ходов до цели: ${dist(G.cur,G.target,new Set(G.hist))}</div>`;
    if(G.win)h+=`<div class="big">${G.win===role?"Вы победили! 🎉":"Друг выиграл"}</div><button id="again">Новая игра</button>`;
    else if(G.turn===role)h+=`<div class="big">Ваш ход</div>
      <div class="mut">Измените ровно одну букву — получится настоящее слово</div>
      <div class="row"><input id="nw" maxlength="4" autocomplete="off" autocapitalize="off"><button id="go">Ходить</button><button class="sec" id="ht">Подсказка</button></div>
      <div class="mut" id="hx"></div>
      <div class="err" id="er"></div>`;
    else h+=`<div class="big">Ход друга…</div>`;
    h+=`<div class="hist">${G.hist.map((w,i)=>(i?'<span class="mut">→</span>':"")+`<span class="mut">${esc(w)}</span>`).join("")}</div>`;
  }
  app.innerHTML=h;
  const cp=document.getElementById("cp");
  if(cp)cp.onclick=()=>{const i=document.getElementById("lk");i.select();try{navigator.clipboard.writeText(i.value)}catch(e){}cp.textContent="Скопировано"};
  const go=document.getElementById("go");
  if(go){const nw=document.getElementById("nw");nw.focus();go.onclick=()=>move(nw.value);nw.onkeydown=e=>{if(e.key==="Enter")go.click()}}
  const ht=document.getElementById("ht");
  if(ht)ht.onclick=()=>{const w=nextStep(G.cur,G.target,G.hist);document.getElementById("hx").textContent=w?"Попробуйте слово: "+w.toUpperCase():"Подсказки нет"};
  const ag=document.getElementById("again");
  if(ag)ag.onclick=()=>role==="a"?restart():send({t:"again"});
}
let busy=false;
const er=t=>{const e=document.getElementById("er");if(e)e.textContent=t};
const norm=v=>v.trim().toLowerCase().replace(/ё/g,"е");
async function validate(w,r){
  if(G.win||G.turn!==r)return"Сейчас не ваш ход";
  if(!/^[а-я]{4}$/.test(w))return"Нужно слово из 4 букв";
  if(diff(w,G.cur)!==1)return"Нужно изменить ровно одну букву";
  if(G.hist.includes(w))return"Это слово уже было";
  if(!WORDS.has(w)){
    const ok=await online(w);
    if(ok===false)return"Такого слова нет в словаре";
    if(ok===null&&!RARE.has(w))return"Не удалось проверить слово онлайн — попробуйте другое";
    addWord(w);
  }
  if(w!==G.target){const u=new Set(G.hist);u.add(w);if(dist(w,G.target,u)<0)return"После этого слова до цели уже не добраться — выберите другое";}
  return"";
}
async function move(v){
  if(busy)return;
  const w=norm(v);
  er("Проверяем слово…");
  if(role==="a")return apply("a",w);
  busy=true;
  try{const e=await validate(w,"b");if(e)er(e);else send({t:"move",w})}finally{busy=false}
}
async function apply(r,v){
  if(busy)return;
  busy=true;
  try{
    const w=norm(v),e=await validate(w,r);
    if(e){if(r==="a")er(e);else send({t:"reject",to:guest,why:e});return}
    G.cur=w;G.hist.push(w);G.turn=other(r);G.win=w===G.target?r:"";
    pub();show();
  }finally{busy=false}
}
function restart(){G=fresh(G.level);G.joined=!!guest;pub();show()}
const h0=location.hash.slice(1);
h0?join(h0):home("");
</script></body></html>
