<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цепочка слов</title>
<style>
:root{--bg:#faf7f2;--fg:#1f1b16;--mut:#7a7066;--card:#fff;--acc:#d9622b;--ok:#2f8f5b;--bd:#e5ddd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--fg:#f3ede4;--mut:#a39a8e;--card:#241f19;--acc:#ef7d45;--ok:#3aa56c;--bd:#3a332a}}
:root[data-theme="dark"]{--bg:#17140f;--fg:#f3ede4;--mut:#a39a8e;--card:#241f19;--acc:#ef7d45;--ok:#3aa56c;--bd:#3a332a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{text-align:center;margin:28px 56px 0;font-size:clamp(28px,7vw,44px);letter-spacing:-.5px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;text-align:center}
button{font:inherit;font-weight:600;border:0;border-radius:14px;background:var(--acc);color:#fff;padding:14px 28px;font-size:18px;cursor:pointer}
button:disabled{opacity:.5}
.sec{background:var(--card);color:var(--fg);border:1px solid var(--bd);padding:10px 16px;font-size:15px}
.chip{background:var(--card);color:var(--fg);border:2px solid var(--bd);padding:8px 14px;font-size:16px;border-radius:12px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:5;width:44px;height:44px;padding:0;border-radius:50%;font-size:20px;background:var(--card);border:1px solid var(--bd)}
.w{display:flex;gap:6px;justify-content:center}
.t{width:clamp(38px,12vw,64px);aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--bd);border-radius:12px;background:var(--card);font-size:clamp(22px,7vw,36px);font-weight:700;text-transform:uppercase}
.t.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sm .t{width:32px;font-size:17px;border-radius:8px}
.mut{color:var(--mut);font-size:15px}
input{font:inherit;font-size:20px;text-align:center;text-transform:uppercase;width:150px;padding:10px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.err{color:#d23b3b;min-height:20px;font-size:15px}
.hist{max-width:100%;display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;justify-content:center}
.ci{display:inline-flex;align-items:center;gap:3px;font-size:15px;color:var(--mut)}
.big{font-size:22px;font-weight:700}
.q{width:22px;height:22px;min-width:22px;padding:0;border-radius:50%;font-size:13px;line-height:1;background:var(--card);color:var(--mut);border:1px solid var(--bd);margin-left:2px}
.wordrow{display:flex;align-items:center;gap:8px}
.def{max-width:min(520px,92vw);font-size:15px;line-height:1.4}
.def a{color:var(--acc)}
</style></head><body>
<button id="snd" aria-label="sound">🔊</button>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- словари и граф слов ---------- */
const DICTS={};
function getDict(lang,n){
  const k=lang+n;if(DICTS[k])return DICTS[k];
  const raw=DATA[k],W=[],E=[],C=[];
  for(const t of raw.w.split(" ")){if(!t)continue;const f=t[0],w=(f==="*"||f==="+")?t.slice(1):t;W.push(w);if(f==="*"){E.push(w);C.push(w)}else if(f==="+")C.push(w)}
  const d={lang,n,W:new Set(W),R:new Set(raw.r?raw.r.split(" "):[]),E,ES:new Set(E),CS:new Set(C),L:raw.L,ADJ:{},P:{}};
  for(const w of W)add(d,w);
  return DICTS[k]=d;
}
function add(d,w){
  if(d.ADJ[w])return;
  d.ADJ[w]=[];d.W.add(w);
  for(let i=0;i<d.n;i++){const k=w.slice(0,i)+"_"+w.slice(i+1),a=d.P[k]||(d.P[k]=[]);for(const v of a){d.ADJ[w].push(v);d.ADJ[v].push(w)}a.push(w)}
}
const diff=(a,b)=>{let c=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])c++;return c};
function bfs(d,s,ok){
  const m={[s]:0},q=[s];
  for(let i=0;i<q.length;i++)for(const n of d.ADJ[q[i]])if(!(n in m)&&ok(n)){m[n]=m[q[i]]+1;q.push(n)}
  return m;
}
// Все расчёты идут от ЦЕЛИ: расстояние от цели до слов, не заходя в уже использованные.
// Возвращает следующее слово на кратчайшем пути и число ходов (null, если дойти нельзя).
function plan(d,cur,t,hist){
  const used=new Set(hist);
  const pick=ok=>{
    const m={[t]:0},q=[t];
    for(let i=0;i<q.length;i++)for(const n of d.ADJ[q[i]])if(!(n in m)&&!used.has(n)&&ok(n)){m[n]=m[q[i]]+1;q.push(n)}
    let best=null;
    for(const n of d.ADJ[cur]||[])if(n in m&&(best===null||m[n]<m[best]))best=n;
    return best===null?null:[best,m[best]+1];
  };
  const a=pick(n=>d.CS.has(n)),b=pick(()=>true);
  if(!b)return null;
  return{w:(a&&a[1]<=b[1]+1)?a[0]:b[0],d:b[1]};
}
function puzzle(d,lv){
  const idx={easy:0,medium:1,hard:2}[lv]||0,r=d.L[idx];
  for(let k=0;k<400;k++){
    const s=d.E[Math.floor(Math.random()*d.E.length)];
    const df=bfs(d,s,()=>true),dc=bfs(d,s,n=>d.CS.has(n));
    let c=Object.keys(df).filter(w=>d.ES.has(w)&&df[w]>=r[0]&&df[w]<=r[1]&&dc[w]!==undefined&&dc[w]<=df[w]+1);
    if(!c.length&&k>=120)c=Object.keys(df).filter(w=>d.ES.has(w)&&df[w]>=r[0]&&df[w]<=r[1]);
    if(c.length)return[s,c[Math.floor(Math.random()*c.length)]];
  }
  if(idx>0)return puzzle(d,idx===2?"medium":"easy");
  for(let k=0;k<100;k++){
    const s=d.E[Math.floor(Math.random()*d.E.length)],df=bfs(d,s,()=>true);
    const c=Object.keys(df).filter(w=>d.ES.has(w)&&df[w]>=2);
    if(c.length)return[s,c[0]];
  }
  return[d.E[0],d.E[1]];
}

/* ---------- онлайн: проверка слова и значение ---------- */
const OC={},DEF={};
const BADCAT=/Устаревш|Историзм|Имена собственные|Фамилии|Топоним|Мужские имена|Женские имена|Аббревиатуры|Сокращения|Диалект|Областн|Жаргон|Нецензурн|Вульгарн/;
async function online(w,lang,n){
  const key=lang+w;if(key in OC)return OC[key];
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),6000);
  try{
    let ok;
    if(lang==="ru"){
      const r=await fetch("https://ru.wiktionary.org/w/api.php?action=query&format=json&origin=*&prop=categories&cllimit=max&titles="+encodeURIComponent(w),{signal:c.signal});
      const j=await r.json(),p=Object.values(j.query.pages)[0],cats=(p.categories||[]).map(x=>x.title);
      ok=cats.some(x=>new RegExp("Слова из "+n+" букв\\/ru$").test(x))&&!cats.some(x=>BADCAT.test(x));
    }else{
      const r=await fetch("https://en.wiktionary.org/api/rest_v1/page/definition/"+encodeURIComponent(w),{signal:c.signal});
      if(r.status===404)ok=false;
      else{const j=await r.json(),a=j.en||[];ok=a.some(e=>!/proper noun|symbol|letter|abbreviation|initialism|acronym/i.test(e.partOfSpeech||""))}
    }
    clearTimeout(tm);return OC[key]=ok;
  }catch(e){clearTimeout(tm);return null}
}
function clean(s){
  for(let i=0;i<6;i++)s=s.replace(/\{\{([^{}]*)\}\}/g,(_,b)=>{const a=b.split("|");return/^помета/i.test(a[0].trim())?"("+a.slice(1).filter(x=>x&&!x.includes("=")).join(", ")+")":""});
  return s.replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,"$1").replace(/'{2,}/g,"").replace(/<ref[\s\S]*?<\/ref>|<[^>]+>/g,"").replace(/\s+/g," ").trim();
}
function ruDef(t){
  const i=t.indexOf("{{-ru-}}");if(i<0)return"";
  const rest=t.slice(i+8),e=rest.search(/\n=\s*\{\{-[a-z-]+-\}\}\s*=/),sec=e<0?rest:rest.slice(0,e);
  const m=sec.match(/\n={3,4}\s*Значение\s*={3,4}\s*\n([\s\S]*?)(?=\n={2,4}[^=]|$)/);
  if(!m)return"";
  const defs=m[1].split("\n").filter(l=>/^#(?![*:#])/.test(l)).map(l=>clean(l.replace(/^#\s*/,""))).filter(Boolean).slice(0,3);
  return defs.length>1?defs.map((x,k)=>`${k+1}) ${x}`).join(" "):(defs[0]||"");
}
function enDef(j){
  const out=[];
  for(const e of j.en||[]){
    const d=e.definitions&&e.definitions[0],txt=d&&(d.definition||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
    if(txt)out.push((e.partOfSpeech?e.partOfSpeech.toLowerCase()+": ":"")+txt);
    if(out.length>=3)break;
  }
  return out.join(" • ");
}
async function lookup(w,lang){
  try{
    if(lang==="ru"){
      const r=await fetch("https://ru.wiktionary.org/w/api.php?action=query&format=json&formatversion=2&origin=*&prop=revisions&rvprop=content&rvslots=main&titles="+encodeURIComponent(w));
      const j=await r.json(),p=j.query.pages[0],txt=p&&p.revisions&&p.revisions[0].slots.main.content;
      return txt?ruDef(txt):"";
    }
    const r=await fetch("https://en.wiktionary.org/api/rest_v1/page/definition/"+encodeURIComponent(w));
    if(r.status===404)return"";
    return enDef(await r.json());
  }catch(e){return null}
}
let curDef=null;
async function showDef(w){
  curDef={w,st:"load"};renderDef();
  const k=LANG+w;
  if(!(k in DEF)){const x=await lookup(w,LANG);if(x!==null)DEF[k]=x;else{if(curDef&&curDef.w===w){curDef.st="none";renderDef()}return}}
  if(curDef&&curDef.w===w){curDef.text=DEF[k];curDef.st=DEF[k]?"ok":"none";renderDef()}
}
function renderDef(){
  const el=document.getElementById("df");if(!el)return;
  if(!curDef){el.innerHTML="";return}
  const url=(LANG==="ru"?"https://ru.wiktionary.org/wiki/":"https://en.wiktionary.org/wiki/")+encodeURIComponent(curDef.w);
  el.innerHTML=`<b>${esc(curDef.w.toUpperCase())}</b> — ${curDef.st==="load"?T("loading"):curDef.st==="ok"?esc(curDef.text):T("noDef")} · <a href="${url}" target="_blank" rel="noopener">${T("wiki")}</a>`;
}

/* ---------- звук ---------- */
let AC=null,muted=false;
try{muted=localStorage.getItem("wl_mute")==="1"}catch(e){}
const sb=document.getElementById("snd");
function sbUpdate(){sb.textContent=muted?"🔇":"🔊";sb.setAttribute("aria-label",muted?T("sndOn"):T("sndOff"));sb.title=sb.getAttribute("aria-label")}
sb.onclick=()=>{muted=!muted;try{localStorage.setItem("wl_mute",muted?"1":"0")}catch(e){}sbUpdate();if(!muted)snd("out")};
const SEQ={out:[[523,0,.09]],in:[[392,0,.09],[523,.09,.09]],skip:[[330,0,.14]],end:[[523,0,.15],[659,.15,.15],[784,.3,.15],[1047,.45,.4]]};
function snd(kind){
  if(muted)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const now=AC.currentTime;
    for(const[f,s,d]of SEQ[kind]){
      const o=AC.createOscillator(),g=AC.createGain();
      o.type="triangle";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,now+s);g.gain.exponentialRampToValueAtTime(.18,now+s+.01);g.gain.exponentialRampToValueAtTime(.0001,now+s+d);
      o.connect(g);g.connect(AC.destination);o.start(now+s);o.stop(now+s+d+.02);
    }
  }catch(e){}
}

/* ---------- игра ---------- */
const BASE="https://ntfy.sh/";
const app=document.getElementById("app");
let topic="",me="",role="",G=null,D=null,guest="",full=false,got=false,tries=0,timer=null,busy=false,prev=null,selN=4,selLv="easy";
const other=r=>r==="a"?"b":"a";
const rnd=()=>Math.random().toString(36).slice(2,10);
me=rnd()+rnd();
const send=m=>fetch(BASE+topic,{method:"POST",body:JSON.stringify({...m,from:me})}).catch(()=>{});
const pub=()=>{if(guest)send({t:"state",to:guest,g:G})};
const tiles=(w,t,cls="")=>`<div class="w ${cls}">${[...w].map((c,i)=>`<div class="t${t&&t[i]===c?" ok":""}">${esc(c)}</div>`).join("")}</div>`;
const qbtn=w=>`<button class="q" data-w="${esc(w)}" aria-label="?" title="?">?</button>`;
function setLang(l){LANG=l;document.documentElement.lang=l;document.title=T("title");document.getElementById("ttl").textContent=T("title");sbUpdate()}
const lvName=k=>({easy:T("easy"),medium:T("medium"),hard:T("hard")}[k]||"—");
const fresh=(n,lv)=>{D=getDict(LANG,n);const[s,t]=puzzle(D,lv);return{start:s,target:t,cur:s,hist:[s],turn:"a",win:"",joined:false,level:lv,n,lang:LANG}};

function listen(onmsg,onopen,onfail){
  const es=new EventSource(BASE+topic+"/sse");
  let ok=false;
  const t=setTimeout(()=>{if(!ok)onfail()},10000);
  es.onopen=()=>{ok=true;clearTimeout(t);onopen()};
  es.onmessage=e=>{try{const j=JSON.parse(e.data);if(j.event!=="message")return;const m=JSON.parse(j.message);if(m&&m.from!==me)onmsg(m)}catch(_){}};
}
function home(err){
  setLang(LANG);
  app.innerHTML=`<button id="mk">${T("create")}</button>
  <div class="row"><button class="chip${LANG==="ru"?" on":""}" data-l="ru">Русский</button><button class="chip${LANG==="en"?" on":""}" data-l="en">English</button></div>
  <div class="err">${esc(err||"")}</div>`;
  document.getElementById("mk").onclick=setup;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;home("")});
}
function setup(){
  const d=getDict(LANG,selN),rg=d.L.map(r=>r[1]>=99?r[0]+"+":r[0]===r[1]?""+r[0]:r[0]+"–"+r[1]);
  app.innerHTML=`<div class="big">${T("setup")}</div>
  <div class="mut">${T("lenLbl")}</div>
  <div class="row">${[3,4,5].map(n=>`<button class="chip${n===selN?" on":""}" data-n="${n}">${T("letters")(n)}</button>`).join("")}</div>
  <div class="mut">${T("lvLbl")}</div>
  <div class="row">${["easy","medium","hard"].map(k=>`<button class="chip${k===selLv?" on":""}" data-k="${k}">${T(k)}</button>`).join("")}</div>
  <div class="mut" style="max-width:420px">${T("lvHelp")(rg)}</div>
  <button id="st">${T("start")}</button><button class="sec" id="bk">${T("back")}</button>`;
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{selN=+b.dataset.n;setup()});
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{selLv=b.dataset.k;setup()});
  document.getElementById("st").onclick=()=>startHost(selN,selLv);
  document.getElementById("bk").onclick=()=>home("");
}
function startHost(n,lv){
  app.innerHTML=`<div class="mut">${T("creating")}</div>`;
  setTimeout(()=>{
    topic="wc"+rnd()+rnd();role="a";guest="";prev=null;G=fresh(n,lv);
    let shown=false;
    listen(m=>{
      if(m.t==="hello"){
        if(!guest||guest===m.from){guest=m.from;G.joined=true;pub();show()}
        else send({t:"full",to:m.from});
      }else if(m.from===guest){
        if(m.t==="move")apply("b",String(m.w));
        else if(m.t==="skip")skipTurn("b");
        else if(m.t==="again"&&G.win)restart();
      }
    },()=>{if(!shown){shown=true;location.hash=topic;show()}},()=>home(T("noServer")));
  },30);
}
function join(h){
  topic=h;role="b";
  app.innerHTML=`<div class="mut">${T("conn")}</div>`;
  listen(m=>{
    if(m.to!==me)return;
    if(m.t==="state"&&m.g&&Array.isArray(m.g.hist)&&[3,4,5].includes(m.g.n)&&(m.g.lang==="ru"||m.g.lang==="en")){got=true;clearTimeout(timer);G=m.g;show()}
    else if(m.t==="full"){full=true;clearTimeout(timer);app.innerHTML=`<div class="mut">${T("full")}</div>`}
    else if(m.t==="reject")er(String(m.why));
  },hello,()=>{app.innerHTML=`<div class="mut">${T("noServer")}</div>`});
}
function hello(){
  clearTimeout(timer);
  if(full)return;
  if(got){send({t:"hello"});return}
  if(tries++>=6){app.innerHTML=`<div class="mut">${T("hostGone")}</div>`;return}
  send({t:"hello"});timer=setTimeout(hello,4000);
}
function show(){
  setLang(G.lang);D=getDict(G.lang,G.n);
  for(const w of [G.cur,...G.hist])if(typeof w==="string"&&w.length===G.n&&RE[LANG].test(w)&&!D.ADJ[w])add(D,w);
  const hl=G.hist.length;
  if(prev&&G.joined){
    if(G.win&&!prev.win)snd("end");
    else if(hl>prev.hl)snd(G.turn===role?"in":"out");
    else if(hl===prev.hl&&G.turn!==prev.turn&&!G.win)snd("skip");
  }
  prev={hl,win:G.win,turn:G.turn};
  let h=`<div class="mut">${T("goal")}</div>
  <div class="row" style="gap:14px">${tiles(G.start,"","sm")}<span class="big">→</span>${tiles(G.target,"","sm")}</div>`;
  if(!G.joined){
    h+=`<div class="mut">${T("invite")}</div>
    <div class="row"><input id="lk" readonly value="${esc(location.href)}" style="width:min(320px,80vw);text-transform:none;font-size:15px"><button class="sec" id="cp">${T("copy")}</button></div>
    <div class="mut">${T("waiting")}</div>`;
  }else{
    h+=`<div class="wordrow">${tiles(G.cur,G.target)}${qbtn(G.cur)}</div>
    <div class="mut">${T("level")}: ${esc(lvName(G.level))} · ${T("letters")(G.n)}</div>`;
    if(G.win)h+=`<div class="big">${T("over")}</div><div class="mut">${T("moves")(G.hist.length-1)}</div><button id="again">${T("again")}</button>`;
    else{
      const p=plan(D,G.cur,G.target,G.hist);
      h+=`<div class="mut">${T("min")}${p?p.d:"—"}</div>`;
      if(G.turn===role)h+=`<div class="big">${T("your")}</div>
      <div class="mut">${T("rule")}</div>
      <div class="row"><input id="nw" maxlength="${G.n}" autocomplete="off" autocapitalize="off" lang="${G.lang}"><button id="go">${T("move")}</button></div>
      <div class="row"><button class="sec" id="ht">${T("hint")}</button><button class="sec" id="sk">${T("skip")}</button></div>
      <div class="mut" id="hx"></div><div class="err" id="er"></div>`;
      else h+=`<div class="big">${T("friend")}</div>`;
    }
    const dt=bfs(D,G.target,()=>true);
    h+=`<div class="hist">${G.hist.map((w,i)=>(i?'<span class="mut">→</span>':"")+`<span class="ci">${esc(w)} (${dt[w]===undefined?"?":dt[w]})${qbtn(w)}</span>`).join("")}</div>
    <div class="def" id="df"></div>`;
  }
  app.innerHTML=h;
  const cp=document.getElementById("cp");
  if(cp)cp.onclick=()=>{const i=document.getElementById("lk");i.select();try{navigator.clipboard.writeText(i.value)}catch(e){}cp.textContent=T("copied")};
  const go=document.getElementById("go");
  if(go){const nw=document.getElementById("nw");nw.focus();go.onclick=()=>move(nw.value);nw.onkeydown=e=>{if(e.key==="Enter")go.click()}}
  const ht=document.getElementById("ht");
  if(ht)ht.onclick=()=>{const p=plan(D,G.cur,G.target,G.hist);document.getElementById("hx").innerHTML=p?T("tryW")+`<b>${esc(p.w.toUpperCase())}</b>`+qbtn(p.w):T("noHint");bindQ()};
  const sk=document.getElementById("sk");
  if(sk)sk.onclick=()=>role==="a"?skipTurn("a"):send({t:"skip"});
  const ag=document.getElementById("again");
  if(ag)ag.onclick=()=>role==="a"?restart():send({t:"again"});
  bindQ();renderDef();
}
const bindQ=()=>app.querySelectorAll(".q").forEach(b=>b.onclick=()=>showDef(b.dataset.w));
const er=t=>{const e=document.getElementById("er");if(e)e.textContent=t};
const norm=v=>{v=v.trim().toLowerCase();return LANG==="ru"?v.replace(/ё/g,"е"):v};
async function validate(w,r){
  if(G.win||G.turn!==r)return T("eNotTurn");
  if(w.length!==G.n||!RE[G.lang].test(w))return T("eLen")(G.n);
  if(diff(w,G.cur)!==1)return T("eOne");
  if(G.hist.includes(w))return T("eUsed");
  if(!D.W.has(w)){
    const ok=await online(w,G.lang,G.n);
    if(ok===false)return T("eNo");
    if(ok===null&&!D.R.has(w))return T("eNet");
    add(D,w);
  }
  if(w!==G.target&&!plan(D,w,G.target,[...G.hist,w]))return T("eDead");
  return"";
}
async function move(v){
  if(busy)return;
  const w=norm(v);
  er(T("checking"));
  if(role==="a")return apply("a",w);
  busy=true;
  try{const e=await validate(w,"b");if(e)er(e);else send({t:"move",w})}finally{busy=false}
}
async function apply(r,v){
  if(busy)return;
  busy=true;
  try{
    const w=norm(v),e=await validate(w,r);
    if(e){if(r==="a")er(e);else send({t:"reject",to:guest,why:e});return}
    G.cur=w;G.hist.push(w);G.turn=other(r);G.win=w===G.target?r:"";
    pub();show();
  }finally{busy=false}
}
function skipTurn(r){
  if(G.win||G.turn!==r)return;
  G.turn=other(r);pub();show();
}
function restart(){const n=G.n,lv=G.level;G=fresh(n,lv);G.joined=!!guest;prev=null;pub();show()}
setLang(LANG);
const h0=location.hash.slice(1);
h0?join(h0):home("");
</script></body></html>
